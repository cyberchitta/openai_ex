services:
  livebook:
    image: ghcr.io/livebook-dev/livebook:0.19.9
    environment:
      # secrets - values are set in '.env'. It's not in version control, but look at 'env'
      LIVEBOOK_PASSWORD: ${LIVEBOOK_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION}
    # UID (id -u) and GID (id -g) need to be exported in .bashrc (or equivalent)
    user: ${UID}:${GID}
    # 185.199.109.133 is one of four raw.githubusercontent.com edge IPs and is
    # currently unroutable from here. Erlang resolves to a single address and
    # does not retry the others, so notebook asset fetches hang until timeout.
    # Pin a known-good edge IP. Remove once the route heals.
    extra_hosts:
      - "raw.githubusercontent.com:185.199.108.133"
    volumes:
      - ..:/data
    ports:
      - 8080:8080
      - 8081:8081
      # port for llama.cpp-python server to work with local LLMs
      - 8000:8000
